
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punya gw 🎀</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe0ed, #fbc2d8, #fce4ec);
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.75);
            padding: 55px 45px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(214, 112, 147, 0.2);
            border: 2px solid white;
            max-width: 90%;
        }

        .heart {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #d45d8c;
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        p {
            color: #b76e8e;
            font-size: 16px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: #e98bb2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
        }

        .button:hover {
            background: #d45d8c;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="heart">🎀</div>

        <h1>ALOO, INI DI BRANCH APIP!</h1>

        <p>ohayou konnichiwa konbnawa</p>

        <a href="#" class="button">HALLOW!</a>
    </div>
</body>
</html>
